<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async function</title>
</head>
<body>
    <h1>This is aync Function</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</body>
<script>
    let count =1;
    const selH1=document.querySelector("h1");
    const intervalFunc=function(){
        // count++;
        // selH1.textContent+=`Counter: ${count}`
        document.querySelector("body").style.backgroundColor=generateRandomColor(); 
        
    
    }
    let intervalId=undefined;
    document.querySelector("#start").addEventListener('click', ()=>{
        intervalId=setInterval(intervalFunc,1000);
    })
    document.querySelector("#stop").addEventListener('click',()=>{
        clearInterval(intervalId);
        intervalId=null;
    })

    const generateRandomColor=function (){
        const colorRange="0123456789ABCDEF"
        let color="#";
        for( i=0;i<6;i++){
            color+=colorRange[Math.floor(Math.random()*16)];
        }
        return color;
    }
</script>
</html>
