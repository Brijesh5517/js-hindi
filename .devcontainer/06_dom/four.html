<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brijesh learning DOM</title>
</head>
<body style="background-color: #212121; color: azure;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addNewLang(langName, parentNode){
        const newli=document.createElement("li");
        newli.innerText=langName;
        parentNode.appendChild(newli)
    }
    const selectUl=document.querySelector(".language");
    addNewLang("Python",selectUl);
    addNewLang("Java",selectUl);

    function addLanguageOptmisised(langName, parentNode){
        const li=document.createElement("li");
        li.appendChild(document.createTextNode(langName));
        parentNode.appendChild(li)
    }
    addLanguageOptmisised("Typescript", selectUl);
    // //edit

    const secandli=document.querySelector("li:nth-child(2)");
    // secandli.innerText="New text"
    secandli.appendChild(document.createTextNode("Brijesh"))


    //remove
    const lastelement=document.querySelector("li:last-child");
     lastelement.remove()
</script>
</html>
