<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="conatiner">
    <h1>Calculate your BMI</h1>
    <form >
        <p><label >Height in CM: </label> <input type="text" name="wight" id="Height"></p>
        <p><label >Weight in Kg: </label> <input type="text" name="wight" id="weight"></p>
        <button>Calculate</button>
        <div id="result"></div>
        <div class="Guide">
            <h5>BMI Guide</h5>
            <p>BMI ratio under 18.6 = Under Weight</p>
            <p>BMI ratio is between 18.6 to 24.9 = Normal Weight</p>
            <p>BMI ratio above 24.9 = Over Weight</p>
        </div>
    </form>
   </div>
   <script src="bmi_calculator.js"></script>
    
</body>
</html>
